<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#187e7a">
  <title>Контакты врача</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 28px 20px;
      font-family: system-ui, -apple-system, sans-serif;
      color: #173746;
      background:
        radial-gradient(circle at 15% 10%, #d6f2ee, transparent 50%),
        #edf3f6;
    }

    .card {
      width: min(100%, 420px);
      padding: 40px 28px 28px;
      border: 1px solid white;
      border-radius: 28px;
      background: rgba(255, 255, 255, .97);
      box-shadow: 0 24px 70px #17374618;
      text-align: center;
      animation: appear .7s ease-out both;
    }

    .portrait {
      position: relative;
      width: 136px;
      height: 136px;
      margin: 0 auto 30px;
    }

    .portrait::before {
      content: "";
      position: absolute;
      inset: -8px;
      border: 2px solid #87c9bd;
      border-radius: 50%;
      animation: pulse 2.8s ease-in-out infinite;
      pointer-events: none;
    }

    .photo-frame {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 50%;
      background: #e7f5f2;
      color: #187e7a;
      font-size: 38px;
      font-weight: 600;
    }

    .photo-frame img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 6vw, 30px);
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .specialty {
      margin: 14px 0 8px;
      color: #187e7a;
      font-size: 18px;
    }

    .clinic {
      margin: 0;
      color: #64808c;
      line-height: 1.5;
    }

    .phone {
      display: inline-block;
      margin: 24px 0;
      color: #173746;
      font-size: 19px;
      text-decoration: none;
    }

    .actions {
      display: grid;
      gap: 12px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      font: inherit;
      font-weight: 650;
      text-decoration: none;
      cursor: pointer;
      color: white;
      background: #187e7a;
    }

    .button.secondary {
      color: #173746;
      background: #eaf0f3;
    }

    a:focus-visible, button:focus-visible {
      outline: 3px solid #173746;
      outline-offset: 4px;
    }

    .note {
      margin: 18px 0 0;
      color: #64808c;
      font-size: 12px;
      line-height: 1.5;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(.98); opacity: .4; }
      50% { transform: scale(1.07); opacity: .9; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before { animation: none !important; }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="portrait">
      <div class="photo-frame">
        <span id="initials" aria-hidden="true"></span>
        <img id="photo" src="foto.png" alt="Фото врача">
      </div>
    </div>

    <h1 id="name"></h1>
    <p class="specialty" id="specialty"></p>
    <p class="clinic" id="clinic"></p>

    <a class="phone" id="phone"></a>

    <div class="actions">
      <a class="button" id="call">Позвонить</a>
      <button class="button secondary" id="save" type="button">
        Сохранить контакт
      </button>
    </div>

    <p class="note">
      При сохранении телефон предложит открыть<br>
      или скачать карточку контакта.
    </p>
  </main>

  <script>
    // Замените эти данные перед публикацией.
    const doctor = {
      lastName: "Фамилия",
      firstName: "Имя",
      middleName: "Отчество",
      specialty: "Травматолог-ортопед",
      clinic: "Название клиники",
      phone: "+70000000000",
      phoneDisplay: "+7 (000) 000-00-00"
    };

    const fullName = [
      doctor.lastName,
      doctor.firstName,
      doctor.middleName
    ].filter(Boolean).join(" ");

    document.title = `${fullName} — ${doctor.specialty}`;

    document.getElementById("name").textContent = fullName;
    document.getElementById("specialty").textContent = doctor.specialty;
    document.getElementById("clinic").textContent = doctor.clinic;

    const phoneLink = document.getElementById("phone");
    phoneLink.textContent = doctor.phoneDisplay;
    phoneLink.href = `tel:${doctor.phone}`;

    document.getElementById("call").href = `tel:${doctor.phone}`;

    document.getElementById("initials").textContent = [
      doctor.firstName,
      doctor.lastName
    ].map(part => part.trim().charAt(0)).join("");

    const photo = document.getElementById("photo");
    photo.alt = `Фото: ${fullName}`;

    const hidePhoto = () => { photo.hidden = true; };
    photo.addEventListener("error", hidePhoto);

    // Обработка случая, когда ошибка загрузки уже произошла.
    if (photo.complete && photo.naturalWidth === 0) hidePhoto();

    const escapeVCard = value => String(value)
      .replace(/\\/g, "\\\\")
      .replace(/\r\n|\r|\n/g, "\\n")
      .replace(/;/g, "\\;")
      .replace(/,/g, "\\,");

    document.getElementById("save").addEventListener("click", () => {
      const structuredName = [
        doctor.lastName,
        doctor.firstName,
        doctor.middleName,
        "",
        ""
      ].map(escapeVCard).join(";");

      const lines = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        `N:${structuredName}`,
        `FN:${escapeVCard(fullName)}`,
        `ORG:${escapeVCard(doctor.clinic)}`,
        `TITLE:${escapeVCard(doctor.specialty)}`,
        `TEL;TYPE=WORK,VOICE:${doctor.phone}`
      ];

      if (location.protocol === "https:") {
        lines.push(`URL:${location.href.split("#")[0]}`);
      }

      lines.push("END:VCARD");

      const file = new Blob(
        [lines.join("\r\n") + "\r\n"],
        { type: "text/vcard;charset=utf-8" }
      );

      const url = URL.createObjectURL(file);
      const link = document.createElement("a");
      link.href = url;
      link.download = "doctor.vcf";
      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(url), 30000);
    });
  </script>
</body>
</html>
